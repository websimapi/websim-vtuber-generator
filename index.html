<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTuber Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const room = new WebsimSocket();

        function VTuberGenerator() {
            const [prompt, setPrompt] = useState('');
            const [isGenerating, setIsGenerating] = useState(false);
            const [selectedVTuber, setSelectedVTuber] = useState(null);
            const [currentUser, setCurrentUser] = useState(null);
            const [editingVTuber, setEditingVTuber] = useState(null);
            const [anchorPoints, setAnchorPoints] = useState([]);
            const [isCameraActive, setIsCameraActive] = useState(false);
            const [trackingData, setTrackingData] = useState(null);
            
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const holisticRef = useRef(null);
            const cameraRef = useRef(null);
            
            // Subscribe to VTuber records
            const vtubers = React.useSyncExternalStore(
                room.collection('vtuber_v2').subscribe,
                room.collection('vtuber_v2').getList
            );

            useEffect(() => {
                async function getCurrentUser() {
                    const user = await window.websim.getCurrentUser();
                    setCurrentUser(user);
                }
                getCurrentUser();
            }, []);

            useEffect(() => {
                if (isCameraActive) {
                    initializeCamera();
                } else {
                    stopCamera();
                }
                
                return () => stopCamera();
            }, [isCameraActive]);

            const initializeCamera = async () => {
                try {
                    const holistic = new Holistic({
                        locateFile: (file) => {
                            return `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`;
                        }
                    });
                    
                    holistic.setOptions({
                        modelComplexity: 1,
                        smoothLandmarks: true,
                        enableSegmentation: false,
                        smoothSegmentation: true,
                        refineFaceLandmarks: true,
                        minDetectionConfidence: 0.5,
                        minTrackingConfidence: 0.5
                    });
                    
                    holistic.onResults(onHolisticResults);
                    holisticRef.current = holistic;
                    
                    const camera = new Camera(videoRef.current, {
                        onFrame: async () => {
                            if (holisticRef.current) {
                                await holisticRef.current.send({image: videoRef.current});
                            }
                        },
                        width: 640,
                        height: 480
                    });
                    
                    cameraRef.current = camera;
                    await camera.start();
                } catch (error) {
                    console.error('Error initializing camera:', error);
                    setIsCameraActive(false);
                }
            };

            const stopCamera = () => {
                if (cameraRef.current) {
                    cameraRef.current.stop();
                    cameraRef.current = null;
                }
                if (holisticRef.current) {
                    holisticRef.current.close();
                    holisticRef.current = null;
                }
            };

            const onHolisticResults = (results) => {
                setTrackingData(results);
                
                if (canvasRef.current && results) {
                    const canvas = canvasRef.current;
                    const ctx = canvas.getContext('2d');
                    
                    canvas.width = videoRef.current.videoWidth;
                    canvas.height = videoRef.current.videoHeight;
                    
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(videoRef.current, 0, 0, canvas.width, canvas.height);
                    
                    // Draw face landmarks
                    if (results.faceLandmarks) {
                        drawLandmarks(ctx, results.faceLandmarks, '#ff6b6b', 2);
                    }
                    
                    // Draw pose landmarks
                    if (results.poseLandmarks) {
                        drawLandmarks(ctx, results.poseLandmarks, '#45b7d1', 4);
                    }
                }
            };

            const drawLandmarks = (ctx, landmarks, color, size) => {
                ctx.fillStyle = color;
                landmarks.forEach(landmark => {
                    ctx.beginPath();
                    ctx.arc(landmark.x * ctx.canvas.width, landmark.y * ctx.canvas.height, size, 0, 2 * Math.PI);
                    ctx.fill();
                });
            };

            const getVTuberTransform = () => {
                if (!trackingData || !trackingData.faceLandmarks || !selectedVTuber?.anchorPoints) {
                    return {};
                }
                
                const face = trackingData.faceLandmarks;
                if (face.length === 0) return {};
                
                // Calculate head rotation based on nose and face landmarks
                const nose = face[1]; // Nose tip
                const leftEye = face[33];
                const rightEye = face[263];
                
                if (!nose || !leftEye || !rightEye) return {};
                
                // Calculate head tilt
                const eyeCenterX = (leftEye.x + rightEye.x) / 2;
                const eyeCenterY = (leftEye.y + rightEye.y) / 2;
                const tiltAngle = Math.atan2(rightEye.y - leftEye.y, rightEye.x - leftEye.x) * (180 / Math.PI);
                
                // Calculate head position offset
                const headX = (nose.x - 0.5) * 100; // Convert to percentage offset
                const headY = (nose.y - 0.5) * 100;
                
                return {
                    transform: `translate(${headX * 0.3}px, ${headY * 0.3}px) rotate(${tiltAngle * 0.3}deg)`,
                    filter: trackingData.poseLandmarks ? 'none' : 'grayscale(50%)'
                };
            };

            const generateVTuber = async () => {
                if (!prompt.trim() || isGenerating) return;
                
                setIsGenerating(true);
                try {
                    // Generate VTuber image with AI
                    const result = await websim.imageGen({
                        prompt: `VTuber character design: ${prompt}, anime style, cute, expressive, colorful, high quality digital art`,
                        transparent: true,
                        aspect_ratio: "3:4"
                    });
                    
                    // Convert image URL to blob and upload to permanent storage
                    const response = await fetch(result.url);
                    const blob = await response.blob();
                    const file = new File([blob], 'vtuber.png', { type: 'image/png' });
                    const permanentUrl = await websim.upload(file);
                    
                    // Save to database
                    const vtuber = await room.collection('vtuber_v2').create({
                        name: generateVTuberName(prompt),
                        prompt: prompt,
                        imageUrl: permanentUrl,
                        likes: 0,
                        anchorPoints: []
                    });
                    
                    // Auto-select the newly generated VTuber
                    setSelectedVTuber(vtuber);
                    setPrompt('');
                } catch (error) {
                    console.error('Error generating VTuber:', error);
                    alert('Failed to generate VTuber. Please try again.');
                } finally {
                    setIsGenerating(false);
                }
            };

            const generateVTuberName = (prompt) => {
                const prefixes = ['Luna', 'Kira', 'Yuki', 'Hana', 'Sora', 'Miku', 'Rika', 'Neko', 'Yui', 'Aoi'];
                const suffixes = ['chan', 'kun', 'san', 'tan'];
                const randomPrefix = prefixes[Math.floor(Math.random() * prefixes.length)];
                const randomSuffix = suffixes[Math.floor(Math.random() * suffixes.length)];
                return `${randomPrefix}-${randomSuffix}`;
            };

            const likeVTuber = async (vtuber) => {
                if (!currentUser) return;
                
                try {
                    await room.collection('vtuber_v2').update(vtuber.id, {
                        likes: vtuber.likes + 1
                    });
                } catch (error) {
                    console.error('Error liking VTuber:', error);
                }
            };

            const startEditing = (vtuber) => {
                setEditingVTuber(vtuber);
                setAnchorPoints(vtuber.anchorPoints || []);
            };

            const stopEditing = () => {
                setEditingVTuber(null);
                setAnchorPoints([]);
            };

            const saveAnchorPoints = async () => {
                if (!editingVTuber) return;
                
                try {
                    await room.collection('vtuber_v2').update(editingVTuber.id, {
                        anchorPoints: anchorPoints
                    });
                    stopEditing();
                } catch (error) {
                    console.error('Error saving anchor points:', error);
                    alert('Failed to save anchor points. Please try again.');
                }
            };

            const addAnchorPoint = (e, type) => {
                const rect = e.currentTarget.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * 100;
                const y = ((e.clientY - rect.top) / rect.height) * 100;
                
                const newPoint = {
                    id: Date.now(),
                    x: x,
                    y: y,
                    type: type,
                    label: `${type} ${anchorPoints.filter(p => p.type === type).length + 1}`
                };
                
                setAnchorPoints([...anchorPoints, newPoint]);
            };

            const removeAnchorPoint = (pointId) => {
                setAnchorPoints(anchorPoints.filter(p => p.id !== pointId));
            };

            const getAnchorTypeColor = (type) => {
                const colors = {
                    face: '#ff6b6b',
                    hair: '#4ecdc4',
                    body: '#45b7d1',
                    accessory: '#96ceb4'
                };
                return colors[type] || '#333';
            };

            const handleKeyPress = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    generateVTuber();
                }
            };

            return (
                <div className="app">
                    <header className="header">
                        <h1>🎭 VTuber Generator</h1>
                        <p>Create your perfect virtual character with AI</p>
                    </header>

                    <div className="generator-section">
                        <div className="input-container">
                            <textarea
                                value={prompt}
                                onChange={(e) => setPrompt(e.target.value)}
                                onKeyPress={handleKeyPress}
                                placeholder="Describe your VTuber... (e.g., 'cat girl with blue hair and magical powers')"
                                className="prompt-input"
                                rows="3"
                            />
                            <button
                                onClick={generateVTuber}
                                disabled={!prompt.trim() || isGenerating}
                                className="generate-btn"
                            >
                                {isGenerating ? (
                                    <>
                                        <span className="spinner"></span>
                                        Generating...
                                    </>
                                ) : (
                                    '✨ Generate VTuber'
                                )}
                            </button>
                        </div>
                    </div>

                    <div className="gallery-section">
                        <h2>VTuber Gallery</h2>
                        <div className="vtuber-grid">
                            {vtubers.slice().reverse().map((vtuber) => (
                                <div
                                    key={vtuber.id}
                                    className={`vtuber-card ${selectedVTuber?.id === vtuber.id ? 'selected' : ''}`}
                                    onClick={() => setSelectedVTuber(vtuber)}
                                >
                                    <div className="vtuber-image-container">
                                        <img
                                            src={vtuber.imageUrl}
                                            alt={vtuber.name}
                                            className="vtuber-image"
                                        />
                                        {vtuber.anchorPoints && vtuber.anchorPoints.length > 0 && (
                                            <div className="anchor-points-preview">
                                                {vtuber.anchorPoints.map((point) => (
                                                    <div
                                                        key={point.id}
                                                        className="anchor-point-preview"
                                                        style={{
                                                            left: `${point.x}%`,
                                                            top: `${point.y}%`,
                                                            backgroundColor: getAnchorTypeColor(point.type)
                                                        }}
                                                    />
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                    <div className="vtuber-info">
                                        <h3>{vtuber.name}</h3>
                                        <p className="vtuber-prompt">"{vtuber.prompt}"</p>
                                        <div className="vtuber-meta">
                                            <span className="creator">by {vtuber.username}</span>
                                            <div className="vtuber-actions">
                                                {currentUser && currentUser.username === vtuber.username && (
                                                    <button
                                                        onClick={(e) => {
                                                            e.stopPropagation();
                                                            startEditing(vtuber);
                                                        }}
                                                        className="edit-btn"
                                                    >
                                                        ✏️ Edit
                                                    </button>
                                                )}
                                                <button
                                                    onClick={(e) => {
                                                        e.stopPropagation();
                                                        likeVTuber(vtuber);
                                                    }}
                                                    className="like-btn"
                                                >
                                                    ❤️ {vtuber.likes}
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                        
                        {vtubers.length === 0 && (
                            <div className="empty-state">
                                <p>No VTubers yet! Be the first to create one! 🌟</p>
                            </div>
                        )}
                    </div>

                    {selectedVTuber && (
                        <div className="camera-section">
                            <h2>🎥 Live Animation</h2>
                            <div className="camera-controls">
                                <button
                                    onClick={() => setIsCameraActive(!isCameraActive)}
                                    className={`camera-btn ${isCameraActive ? 'active' : ''}`}
                                >
                                    {isCameraActive ? '🔴 Stop Camera' : '📹 Start Camera'}
                                </button>
                                <div className="camera-status">
                                    {isCameraActive ? (
                                        trackingData?.faceLandmarks ? 
                                            '✅ Face tracking active' : 
                                            '⏳ Initializing tracking...'
                                    ) : (
                                        '⚫ Camera off'
                                    )}
                                </div>
                            </div>
                            
                            {isCameraActive && (
                                <div className="camera-container">
                                    <div className="video-container">
                                        <video
                                            ref={videoRef}
                                            className="video-feed"
                                            autoPlay
                                            muted
                                            playsInline
                                        />
                                        <canvas
                                            ref={canvasRef}
                                            className="tracking-overlay"
                                        />
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {selectedVTuber && (
                        <div className="selected-vtuber">
                            <div className="vtuber-display" style={getVTuberTransform()}>
                                <img
                                    src={selectedVTuber.imageUrl}
                                    alt={selectedVTuber.name}
                                    className="display-image"
                                />
                                <div className="vtuber-name-badge">
                                    {selectedVTuber.name}
                                </div>
                                {selectedVTuber.anchorPoints?.map((point) => (
                                    <div
                                        key={point.id}
                                        className="live-anchor-point"
                                        style={{
                                            left: `${point.x}%`,
                                            top: `${point.y}%`,
                                            backgroundColor: getAnchorTypeColor(point.type),
                                            transform: trackingData?.faceLandmarks ? 
                                                `translate(-50%, -50%) scale(${1 + Math.sin(Date.now() * 0.01) * 0.1})` :
                                                'translate(-50%, -50%)'
                                        }}
                                    />
                                ))}
                            </div>
                        </div>
                    )}

                    {editingVTuber && (
                        <div className="edit-modal">
                            <div className="edit-modal-content">
                                <div className="edit-header">
                                    <h2>Add Anchor Points - {editingVTuber.name}</h2>
                                    <button onClick={stopEditing} className="close-btn">✕</button>
                                </div>
                                
                                <div className="edit-instructions">
                                    <p>Click on the image to add anchor points for animation tracking:</p>
                                    <div className="anchor-types">
                                        <label>
                                            <input type="radio" name="anchorType" value="face" defaultChecked />
                                            <span style={{color: '#ff6b6b'}}>● Face</span>
                                        </label>
                                        <label>
                                            <input type="radio" name="anchorType" value="hair" />
                                            <span style={{color: '#4ecdc4'}}>● Hair</span>
                                        </label>
                                        <label>
                                            <input type="radio" name="anchorType" value="body" />
                                            <span style={{color: '#45b7d1'}}>● Body</span>
                                        </label>
                                        <label>
                                            <input type="radio" name="anchorType" value="accessory" />
                                            <span style={{color: '#96ceb4'}}>● Accessory</span>
                                        </label>
                                    </div>
                                </div>

                                <div className="edit-image-container">
                                    <img
                                        src={editingVTuber.imageUrl}
                                        alt={editingVTuber.name}
                                        className="edit-image"
                                        onClick={(e) => {
                                            const selectedType = document.querySelector('input[name="anchorType"]:checked').value;
                                            addAnchorPoint(e, selectedType);
                                        }}
                                    />
                                    <div className="anchor-points-overlay">
                                        {anchorPoints.map((point) => (
                                            <div
                                                key={point.id}
                                                className="anchor-point"
                                                style={{
                                                    left: `${point.x}%`,
                                                    top: `${point.y}%`,
                                                    backgroundColor: getAnchorTypeColor(point.type)
                                                }}
                                                onClick={(e) => {
                                                    e.stopPropagation();
                                                    removeAnchorPoint(point.id);
                                                }}
                                                title={`${point.label} (click to remove)`}
                                            >
                                                <span className="anchor-label">{point.label}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="edit-actions">
                                    <button onClick={stopEditing} className="cancel-btn">Cancel</button>
                                    <button onClick={saveAnchorPoints} className="save-btn">
                                        Save Anchor Points ({anchorPoints.length})
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<VTuberGenerator />, document.getElementById('root'));
    </script>

</body>
